services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - DISCOGS_TOKEN=${DISCOGS_TOKEN:-}
      - DISCOGS_USER_AGENT=${DISCOGS_USER_AGENT:-CollectionTracker/1.0}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-dev-insecure-secret-key-change-in-prod}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-*}
      - DJANGO_DEBUG=false
      - DJANGO_DB_PATH=/data/db.sqlite3
    volumes:
      - collection_tracker_data:/data
    expose:
      - "8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  collection_tracker_data:
